<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiWiFi Painel</title>
<style>
:root{--azul:#2b8af0;--azul2:#1f7be3;--fundo:#2b8af0;--card:#fff;--tx:#333;--mut:#8a8f99;--bd:#eceef2;--sep:#e6e8ec;--verde:#33c272;--lar:#ff8a3d;--roxo:#8c78f0;--amarelo:#ffb21e;--ciano:#2fb8f4;--verm:#f0524b;--ipt:#fff;--iptbd:#d9dce2;--hover:#f6f8fb}
@media (prefers-color-scheme:dark){:root{--fundo:#123a66;--card:#1d2330;--tx:#e6e9ef;--mut:#97a0ae;--bd:#2b3240;--sep:#2b3240;--ipt:#151a24;--iptbd:#38404f;--hover:#232a38}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tx);font:14px/1.5 "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif}
a{color:var(--azul);text-decoration:none}
#topo{max-width:1100px;margin:0 auto;padding:18px 16px 0;display:flex;align-items:center;gap:28px;color:#fff;flex-wrap:wrap}
#logo{font-size:30px;font-weight:200;letter-spacing:1px}
#rotsel{width:auto;height:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:5px 8px;font-size:13px}
#rotsel option{color:#333}
#lang{color:rgba(255,255,255,.6);font-size:13px;white-space:nowrap}
#lang a{color:rgba(255,255,255,.75);padding:0 2px}
#lang a.act{color:#fff;font-weight:600;text-decoration:underline}
#icones{max-width:1100px;margin:18px auto 0;padding:0 16px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px 16px}
.grp{display:flex;flex-direction:column;align-items:stretch;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 10px 0}
.grp .rot{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 8px 2px;text-align:left}
.grp .lin{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.8);font-size:12px;cursor:pointer;padding-bottom:14px;position:relative;min-width:84px;text-align:center}
@media (max-width:700px){#icones{gap:8px 8px;margin-top:12px}.grp{padding:6px 6px 0}.ico{min-width:66px;font-size:11px}.ico .c{width:40px;height:40px;font-size:18px}.grp .rot{margin-bottom:5px}}
.ico .c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ico.act{color:#fff}
.ico .c.tx{font-size:11px;font-weight:600;letter-spacing:.3px}
.ico.act:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top:0;border-bottom-color:rgba(255,255,255,.35)}
#corpo{max-width:1100px;margin:0 auto 30px;padding:0 16px}
#corpo #login{background:#1f242d}
#pagina{--card:transparent;--tx:#e6e9ef;--mut:#a3abb8;--bd:#2f3542;--sep:#2c313b;--ipt:#1b1f27;--iptbd:#434b5b;--hover:#1f242d;--azul:#4a9cf5;--azul2:#2b8af0;background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.35);border-radius:10px;margin-top:14px;padding:10px 34px 30px;min-height:300px}
#pagina .oculto{background:#3a2a18;color:#ffb36b}#pagina .exp{background:#3b1f1f;color:#ff8f86}
#pagina .badge.ok{background:#173426;color:#5ad897}#pagina .badge.no{background:#3b1f1f;color:#ff8f86}
#pagina .inf{background:#3a2a18;color:#ffb36b}#pagina .conf{color:#5ad897}
#pagina .sw{background:#3a4252}#pagina .sw.on{background:var(--verde)}
#pagina .btn{color:#fff}#pagina .btn.sec{color:var(--azul);background:transparent}
#pagina select option{background:#1b1f27;color:#e6e9ef}
#pagina input[type=radio],#pagina input[type=checkbox]{accent-color:var(--azul)}
.mod{border-bottom:1px solid var(--sep);padding:20px 0}
.mod:last-child{border-bottom:0}
.mod .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mod h3{margin:0;font-size:16px;font-weight:500;color:var(--azul)}
.mod .desc{color:var(--mut);font-size:13px;margin:0 0 10px}
.oculto{display:inline-block;font-size:11px;background:#fff1e6;color:#d56a14;border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:middle;font-weight:400}
.exp{background:#fdecec;color:#c0392b}
@media (prefers-color-scheme:dark){.oculto{background:#3a2a18;color:#ffb36b}.exp{background:#3b1f1f;color:#ff8f86}}
.sw{width:46px;height:26px;border-radius:13px;background:#d3d6dc;position:relative;cursor:pointer;flex:none;transition:.2s;border:0;padding:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--verde)}.sw.on:after{left:23px}
.sw[disabled]{opacity:.5;cursor:default}
.f{display:grid;grid-template-columns:150px minmax(0,320px) 1fr;gap:10px 14px;align-items:center;max-width:820px}
.f label.k{color:var(--mut);text-align:right}
.f .t{color:var(--mut);font-size:12px}
@media (max-width:700px){.f{grid-template-columns:1fr}.f label.k{text-align:left}#pagina{padding:8px 16px 20px}}
input[type=text],input[type=password],input[type=number],select{width:100%;height:34px;border:1px solid var(--iptbd);border-radius:3px;padding:0 10px;background:var(--ipt);color:var(--tx);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--azul)}
.btn{display:inline-block;background:var(--azul);color:#fff;border:0;border-radius:3px;height:34px;padding:0 22px;font:inherit;cursor:pointer}
.btn:hover{background:var(--azul2)}.btn.sec{background:transparent;color:var(--azul);border:1px solid var(--azul)}
.btn.perigo{background:var(--verm)}.btn.peq{height:26px;padding:0 10px;font-size:12px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chk{display:flex;align-items:center;gap:6px;color:var(--tx)}
.rad{display:flex;gap:18px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:400;border-bottom:1px solid var(--sep);padding:8px 6px}
td{border-bottom:1px solid var(--sep);padding:8px 6px;vertical-align:middle}
tr:hover td{background:var(--hover)}
.tabw{overflow-x:auto}
.mono{font-family:Consolas,ui-monospace,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kv .i{background:var(--hover);border-radius:6px;padding:12px 14px}
.kv .i b{display:block;font-size:20px;font-weight:500;margin-top:2px}
.kv .i span{color:var(--mut);font-size:12px}
.badge{font-size:11px;border-radius:10px;padding:1px 8px;background:var(--hover);color:var(--mut)}
.badge.ok{background:#e6f7ee;color:#1e9e57}.badge.no{background:#fdecec;color:#c0392b}
@media (prefers-color-scheme:dark){.badge.ok{background:#173426;color:#5ad897}.badge.no{background:#3b1f1f;color:#ff8f86}}
pre{background:var(--hover);border-radius:4px;padding:10px;overflow:auto;max-height:60vh;font-size:12px;white-space:pre-wrap;word-break:break-word}
#login{max-width:420px;margin:60px auto;background:var(--card);border-radius:6px;padding:30px;text-align:center}
#login h2{font-weight:300;margin:0 0 6px}
.muted{color:var(--mut)} .err{color:var(--verm)}
.inf{color:#d56a14;background:#fff1e6;border-radius:3px;padding:0 4px}.conf{color:#1e9e57}
@media (prefers-color-scheme:dark){.inf{background:#3a2a18;color:#ffb36b}.conf{color:#5ad897}}
#veu{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#dlg{background:var(--card);border-radius:6px;max-width:440px;width:100%;padding:22px 24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#dlg h4{margin:0 0 10px;font-size:16px;font-weight:500}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:4px;font-size:13px;display:none;z-index:11;max-width:90vw}
.carregando{color:var(--mut);padding:20px 0}
#rodape{text-align:center;color:rgba(255,255,255,.7);font-size:12px;padding:0 16px 24px}
#rodape a{color:rgba(255,255,255,.9);text-decoration:underline}
</style>
</head>
<body>
<div id="topo">
  <span id="hamb"></span><div id="logo">MiWiFi</div>
  <div style="flex:1"></div>
  <select id="rotsel" title="Roteador"></select>
  <span id="lang" class="notr"><a data-l="pt" href="#">PT</a> · <a data-l="en" href="#">EN</a></span>
  <button id="bcfg" title="Endereços dos roteadores" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px">⚙ Roteadores</button>
  <button id="bsair" title="Encerrar o painel" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px;margin-left:6px">Sair</button>
</div>
<div id="icones"></div>
<div id="corpo"><div id="pagina"><div class="carregando">Carregando…</div></div></div>
<div id="rodape">Painel local · somente neste computador · alterações sempre pedem confirmação · <span class="oculto">oculto</span> = função que não aparece na interface original</div>
<div id="veu"><div id="dlg"></div></div>
<div id="toast"></div>

r": "Router notices", "aviso(s)": "notice(s)", "Nenhum aviso.": "No notices.", "LED do aparelho": "Device LED", "Reiniciar / desligar": "Restart / power off", "Reiniciar derruba a rede por ~1–2 minutos. Desligar exige religar o aparelho na tomada.": "Restarting drops the network for ~1–2 minutes. Powering off requires unplugging and plugging the device back in.", "Reiniciar roteador": "Restart router", "A rede vai cair por 1–2 minutos.": "The network will be down for 1–2 minutes.", "Desligar roteador": "Power off router", "Ele só volta religando na tomada.": "It only comes back after re-plugging it.", "Wi-Fi dual band unificado": "Unified dual-band Wi-Fi", "ligado (um só nome)": "on (single name)", "desligado (nomes separados)": "off (separate names)", "Com ele ligado, 2,4 e 5 GHz usam o mesmo nome e o roteador escolhe a banda de cada aparelho. Pode causar quedas em alguns aparelhos.": "When on, 2.4 and 5 GHz share one name and the router picks the band for each device. May cause drops on some devices.", "Automático": "Automatic", "Automática": "Automatic", "Rede de visitante": "Guest network", "Modo de compatibilidade Wi-Fi 5": "Wi-Fi 5 compatibility mode", "Permite ao roteador falar com vários aparelhos ao mesmo tempo. Só tem efeito se o aparelho também suportar.": "Lets the router talk to several devices at once. Only helps if the device supports it too.", "Conexão rápida (畅快连)": "Quick connect (畅快连)", "Varredura AIoT da antena": "AIoT antenna scan", "Procura aparelhos inteligentes Xiaomi não configurados. O próprio firmware avisa: pode aumentar perda de pacotes e latência em redes congestionadas.": "Looks for unconfigured Xiaomi smart devices. The firmware itself warns: it may increase packet loss and latency on congested networks.", "Prioridade para muitos aparelhos": "Priority for many devices", "Reserva o 2,4 GHz para estabilidade de conexão dos aparelhos. O firmware avisa: pode afetar o link entre os roteadores Mesh e causar desconexões breves ao ligar.": "R  %, memory > 90 %, temperature > 70 °C and WAN link.", "Não deu certo; a regra antiga foi mantida.": "It didn't work; the old rule was kept.", "Ligar": "Turn on", "Ligado; os aparelhos voltam em ~20 s.": "On; devices come back in ~20 s.", "Liga ou desliga o rádio de uma banda sem mexer em nome, senha ou canal (testado: os aparelhos caem e voltam ~20 s depois de religar). O roteador não informa se o rádio está desligado, por isso são dois botões.": "Turns a band's radio off or on without touching name, password or channel (tested: devices drop and come back ~20 s after turning it on). The router doesn't report a radio as off, hence two buttons.", "Expõe um aparelho inteiro à internet. Use só se souber o que está fazendo. O roteador não deixa ligar a DMZ enquanto houver regra de encaminhamento de portas (testado).": "Exposes a whole device to the internet. Use only if you know what you're doing. The router won't enable DMZ while any port-forwarding rule exists (tested).", "Reconectar a internet": "Reconnect the internet", "Reconectar agora": "Reconnect now", "Conectar (se ficou desconectada)": "Connect (if it stayed down)", "Derruba a conexão da porta WAN sem mudar a configuração. Neste roteador ela volta sozinha em cerca de 10 s (testado): serve para forçar uma nova discagem PPPoE. O IP público pode mudar.": "Drops the WAN connection without changing the configuration. On this router it comes back by itself in about 10 s (tested): use it to force a new PPPoE dial. The public IP may change.", "A casa fica uns 10 s sem internet enquanto o roteador disca de novo.": "The house is offline for about 10 s while the router redials.", "Faz o chip de rede encaminhar o tráfego da internet sem passar pelo processador. ⚠ Mudar REINICIA o roteador. Testado em 10/11: o roteador reinicia, mas continua informando \"desligada\" — neste modelo (chip Qualcomm) a opção parece não ter efeito.": "Makes the network chip forward internet traffic without going through the processor. ⚠ Changing it RESTARTS the router. Tested on 10/11: the router restarts but keeps reporting \"off\" — on this model (Qualcomm chip) the option seems to have no effect.", "Função do firmware que desligaria o roteador depois de um tempo e o religaria depois de outro (minutos). Testado em 10/11 no repetidor: não teve efeito neste modelo (ele não desligou).": "Firmware function that would turn the router off after a while and back on after another delay (minutes). Tested on 10/11 on the repeater: no effect on this model (it didn't turn off)."}/*FIMI18N*/, FUNCOES_EN=/*FUNCOES_EN*/{"misns/wifi_share_clear": "Erases the guest network settings.", "misns/wifi_share_info": "Guest network: on/off, name, password and security.", "misns/wifi_share_switch": "Local guest network switch used by the cloud; parameters unknown (code 1523). Use set_wifi_without_restart.", "misystem/active": "Triggers the speed-history refresh (used after the speed test).", "misystem/arn_ignore": "Ignores/releases a device flagged by the anti-intrusion feature.", "misystem/arn_records": "Log of blocked intrusion attempts.", "misystem/arn_security": "Security center: privacy protection, malicious-site firewall and virus-file firewall.", "misystem/arn_security_switch": "Security center: info = JSON with malicious_url_firewall, virus_file_firewall, privacy_protection (0/1); wifi_arn touches the MAC filter. Tested.", "misystem/arn_status": "Anti-intrusion (防蹭网): on/off, level and count of blocked attempts.", "misystem/arn_switch": "Anti-intrusion: open 0/1 (also turns the Wi-Fi MAC filter on/off, model mode 0 block / 1 allow list) and/or level.", "misystem/bandwidth_test": "Measures internet download speed (QoS test).", "misystem/c_backup": "Creates a configuration backup file (keys = parts to include).", "misystem/c_restore": "Restores the chosen items of the uploaded backup (comma-separated keys); a restart is needed afterwards.", "misystem/c_upload": "Uploads a backup (multipart, file in the image field). Only r const eNo=()=>papel(rot)==='repetidor';
function render(){
  if($('#rotsel').value!==rot) $('#rotsel').value=rot;
  // On the repeater (Mesh node), Wi-Fi, internet, security, LAN and QoS come from the main router: pages hidden.
  const grupos=GRUPOS.map(g=>({...g,icones:g.icones.filter(i=>!(eNo()&&SO_PRINCIPAL.has(i[0])))})).filter(g=>g.icones.length);
  const todos=grupos.flatMap(g=>g.icones); if(!sub||!todos.find(i=>i[0]===sub)) sub=todos[0][0];
  $('#icones').innerHTML=grupos.map(g=>`<div class="grp"><div class="rot">${g.nome}</div><div class="lin">${g.icones.map(([id,n,cor,s])=>`<div class="ico ${id===sub?'act':''}" data-sub="${id}"><div class="c${s.length>2?' tx':''}" style="background:${cor}">${s}</div>${n}</div>`).join('')}</div></div>`).join('');
  $$('.ico').forEach(e=>e.onclick=()=>{sub=e.dataset.sub;try{localStorage.setItem('sub',sub);}catch(_){}render();});
  if(!estado.logado[rot]) return telaLogin();
  $('#pagina').innerHTML='<div class="carregando">Carregando…</div>';
  (PAG[sub]||(()=>{}))().catch(e=>{$('#pagina').innerHTML=`<p class="err">Erro: ${esc(e.message)}</p>`;});
}
function telaLogin(){
  $('#pagina').innerHTML=`<div id="login"><h2>${esc(rot[0].toUpperCase()+rot.slice(1))}</h2><p class="muted">${estado.roteadores[rot]} · digite a senha de administrador do roteador</p>
  <form id="flogin"><input type="password" name="s" placeholder="Senha de administrador" autocomplete="current-password" required style="margin:10px 0"><button class="btn" style="width:100%">Entrar</button><p class="err" id="lerr"></p></form>
  <p class="muted" style="font-size:12px">A senha vai direto ao roteador (mesmo método da interface original) e não é guardada.</p></div>`;
  $('#flogin').onsubmit=async e=>{e.preventDefault();const s=e.target.s.value;e.target.s.value='';const r=await srv('/api/login',{roteador:rot,senha:s});if(!r.ok){$('#lerr').textContent=r.erro||'Falhou';return;}estado.logado[rot]=true;render();};
}

const PAG={};

// STATUS: network and devices
PAG.rede=async()=>{
  const [st,wan,mb]=await Promise.all([ler('api/misystem/status'),ler('api/xqnetwork/wan_info').catch(()=>({})),ler('api/xqnetwork/macbind_info').catch(()=>({}))]);
  const w=(wan.info||{}), v4=(w.ipv4||[])[0]||{};
  const devs=(mb.devicelist||[]).filter(d=>d.online!==0).sort((a,b)=>(a.type>b.type?1:-1));
  let h=mod('Visão geral',`<div class="kv">
    <div class="i"><span>Ligado há</span><b>${fmtT(st.upTime)}</b></div>
    <div class="i"><span>Processador</span><b>${Math.round((st.cpu?.load||0)*100)} %</b><span>${st.cpu?.core||''} núcleos · ${st.cpu?.hz||''}</span></div>
    <div class="i"><span>Memória</span><b>${Math.round((st.mem?.usage||0)*100)} %</b><span>de ${st.mem?.total||''}</span></div>

    <div class="i"><span>Internet</span><b>${w.link===1||w.status!==undefined?(v4.ip||'—'):'—'}</b><span>${w.details?.wanType||''}${w.uptime?' · conectado há '+fmtT(w.uptime):''}</span></div>
    <div class="i"><span>Tráfego WAN agora</span><b>↓ ${fmtV(st.wan?.downspeed)}</b><span>↑ ${fmtV(st.wan?.upspeed)}</span></div>
  </div>`);
  h+=mod('Aparelhos conectados',`<div class="tabw"><table><tr><th>Nome</th><th>IP</th><th>MAC</th><th>Conexão</th><th>Velocidade</th><th>Online há</th><th></th></tr>${devs.map(d=>{const s=d.statistics||{};const via=d.type==='line'?'Cabo':(s.dev==='wl1'?'Wi-Fi 2,4 GHz':s.dev==='wl0'?'Wi-Fi 5 GHz':'Wi-Fi');const pai=d.parent?' · via repetidor':'';const bloq=d.authority&&d.authority.wan===0;return `<tr><td>${esc(d.name||d.hostname)}</td><td class="mono">${esc(d.ip)}</td><td class="mono">${esc(d.mac)}</td><td>${via}${pai}</td><td class="mono">↓${fmtV(s.downspeed)} ↑${fmtV(s.upspeed)}</td><td>${fmtT(s.online)}</td><td><button class="btn peq ${bloq?'':'sec'}" data-mac="${esc(d.mac)}" data-n="${esc(d.name)}" data-bl="${bloq?1:0}">${bloq?'Liberar internet':'Bloquear internet'}</button></td></tr>`;}).join('')}</table></div>`,{desc:`${devs.length} aparelhos online. O bloqueio corta só o acesso à internet (o aparelho continua na rede local).`});
  if(!eNo()){
    const [dst,wst]=await Promise.all([ler('api/xqnetwork/devices_statistics').catch(()=>({})),ler('api/xqnetwork/wan_statistics').catch(()=>({}))]);
    const ws=wst.statistics||{},L=(dst.statistics||[]).filter(x=>+x.download||+x.upload).sort((a,b)=>(+b.download)-(+a.download));
    h+=mod('Tráfego acumulado',`<div class="kv"><div class="i"><span>${tr('Internet: baixado')}</span><b>${fmtB(ws.download)}</b><span>${tr('pico')} ${fmtV(ws.maxdownloadspeed)}</span></div><div class="i"><span>${tr('Internet: enviado')}</span><b>${fmtB(ws.upload)}</b><span>${tr('pico')} ${fmtV(ws.maxuploadspeed)}</span></div></div>
      <div class="tabw" style="margin-top:12px"><table><tr><th>Aparelho</th><th>Baixado</th><th>Enviado</th><th>Pico ↓ / ↑</th><th>Online há</th></tr>${L.length?L.slice(0,40).map(x=>`<tr><td>${esc(x.devname||x.mac)}<br><span class="mono muted">${esc(x.mac)}</span></td><td>${fmtB(x.download)}</td><td>${fmtB(x.upload)}</td><td class="mono">${fmtV(x.maxdownloadspeed)} / ${fmtV(x.maxuploadspeed)}</td><td>${+x.online?fmtT(x.online):'—'}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Sem dados.</td></tr>'}</table></div>`,{desc:'Totais desde que o roteador ligou (ou desde que o aparelho conectou), como no app oficial.'});

      <label class="k">Novo nome</label><input type="text" name="name" maxlength="31"><span></span><span></span><div><button class="btn sec">Renomear</button></div><span></span></form>`,{desc:'Muda o nome do aparelho na lista do roteador (e no rastreamento da integração).'});
  }
  $('#pagina').innerHTML=h;
  if($('#fnick')){const fn=$('#fnick');fn.mac.onchange=()=>{const d=(mb.devicelist||[]).find(x=>x.mac===fn.mac.value);fn.name.value=d?(d.name||''):'';};fn.mac.onchange();
    fn.onsubmit=async e=>{e.preventDefault();const n=fn.name.value.trim();if(!n){toast(tr('Digite o nome.'));return;}if(await gravar('api/xqsystem/set_device_nickname',{mac:fn.mac.value,name:n},{titulo:'Renomear aparelho',msg:esc(fn.mac.value)+' → '+esc(n),metodo:'GET'}))render();};}

PAG.mesh=async()=>{
  // Only the main router knows the full tree; on a node, topo_graph returns just the node itself.
  const kp=Object.keys(estado.roteadores).find(k=>papel(k)==='principal'&&estado.logado[k]);
  const tp=kp?await lerDe(kp,'api/misystem/topo_graph'):await ler('api/misystem/topo_graph');
  const g=tp.graph||{}; const nos=[g,...(g.leafs||[])];
  const ipSel=estado.roteadores[rot];
  const papelNo=(n,i)=>kp?(i===0?'Principal':'Repetidor (nó)'):(papel(rot)==='principal'&&i===0?'Principal':'Repetidor (nó)');
  let h=mod('Topologia da rede Mesh',`<div class="tabw"><table><tr><th>Nome</th><th>Local</th><th>IP</th><th>Modelo</th><th>Papel</th></tr>${nos.map((n,i)=>`<tr${n.ip===ipSel?' style="font-weight:600"':''}><td>${esc(n.name)}${n.ip===ipSel?' <span class="badge ok">este</span>':''}</td><td>${esc(n.locale)}</td><td class="mono">${esc(n.ip)}</td><td>${esc(n.hardware)}</td><td>${papelNo(n,i)}</td></tr>`).join('')}</table></div>`,
    {desc:kp?'Árvore lida do roteador principal.':'Faça login no roteador principal para ver a árvore completa.'});
  if(eNo()){
    const sig=await ler('api/xqnetwork/wifiap_signal').catch(()=>({}));
    h+=mod('Ligação até o principal',`<p>${+sig.signal>0?sig.signal+' % de qualidade do sinal sem fio':'Ligação por cabo (sem medição de sinal sem fio).'}</p>`);
  }
  if(!eNo()){
    
    h+=mod('Adicionar nó Mesh',`<ol class="muted" style="margin:0 0 10px;padding-left:18px"><li>Coloque o roteador novo perto do principal (até 3 m) e ligue-o na tomada.</li><li>Espere a luz do sistema ficar azul.</li><li>Clique em Procurar.</li></ol>
      <div class="acoes"><button class="btn sec" id="bMeshScan">Procurar nós</button></div><div id="meshl" style="margin-top:10px"></div>`,{desc:'Inclui outro roteador Xiaomi compatível na rede Mesh, como na interface original. O nó novo copia o Wi-Fi do principal.'});
  }
  $('#pagina').innerHTML=h;
  if($('#bMeshScan'))$('#bMeshScan').onclick=async()=>{const b=$('#bMeshScan'),cx=$('#meshl');b.disabled=true;b.textContent=tr('Procurando…');cx.innerHTML='';
    try{const r=await ler('api/xqnetwork/scan_mesh_node');const L=r.list||[];
      if(!L.length){cx.innerHTML=`<p class="muted">${tr('Nenhum nó encontrado. Confira se ele está ligado, perto e com a luz azul.')}</p>`;return;}
      const LOC=LANG==='en'?{'客厅':'Living room','主卧':'Master bedroom','次卧':'Bedroom','书房':'Study','厨房':'Kitchen','办公室':'Office','地下室':'Basement','卫生间':'Bathroom','阁楼':'Attic','阳台':'Balcony','餐厅':'Dining room'}:{'客厅':'Sala','主卧':'Quarto principal','次卧':'Quarto','书房':'Escritório','厨房':'Cozinha','办公室':'Sala de trabalho','地下室':'Porão','卫生间':'Banheiro','阁楼':'Sótão','阳台':'Varanda','餐厅':'Sala de jantar'};
      cx.innerHTML=`<form class="f" id="fmesh"><label class="k">Nó</label><select name="mac">${L.map(x=>`<option value="${esc(x.mac)}">${esc(x.ssid)} · ${esc(x.mac)}${x.rssi<-60?' · '+tr('sinal fraco, aproxime do principal'):''}</option>`).join('')}</select><span></span>
        <label class="k">Local</label><select name="locate" class="notr">${Object.entries(LOC).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span></span>
        <span></span><div><button class="btn">Adicionar à Mesh</button></div><span></span></form><p id="meshst" class="muted"></p>`;
      $('#fmesh').onsubmit=async e=>{e.preventDefault();const mac=e.target.mac.value,loc=e.target.locate.value;
        if(!await gravar('api/xqnetwork/add_mesh_node',{mac,locate:loc},{titulo:'Adicionar nó Mesh',msg:esc(mac)+' · '+esc(LOC[loc]||loc)+'. '+tr('Leva alguns minutos; não desligue os roteadores.')}))return;
        const ST={1:'Conectando ao nó…',2:'Sincronizando a configuração da Mesh…',3:'Expandindo a rede Mesh (1–2 min)…'},el=$('#meshst');const t0=Date.now();
        const passo=async()=>{let r={};try{r=await ler('api/xqnetwork/get_addnode_status',{mac});}catch(_){}
          if(r.status===0){el.innerHTML=`<b class="conf">${tr('Nó adicionado à Mesh.')}</b>`;return;}
          if(r.status===4){el.innerHTML=`<span class="err">${tr('Falhou. Aproxime o nó do principal e tente de novo.')}</span>`;return;}
          if(Date.now()-t0>6*60000){el.innerHTML=`<span class="err">${tr('Sem resposta depois de 6 minutos. Confira a página Mesh.')}</span>`;return;}
          el.textContent=tr(ST[r.status]||'Aguardando o nó…');setTimeout(passo,3000);};
        passo();};
    }catch(e){toast(tr('Falhou')+': '+e.message,5000);}finally{b.disabled=false;b.textContent=tr('Procurar nós');}};
};

  $('#pagina').innerHTML=h;

  const f6=$('#f6'),T6={nat:'A rede de casa usa o prefixo fixo fd00:6868:6868::/64.',native:'O prefixo muda a cada reconexão da operadora.',static:'Use só se a operadora forneceu endereço e prefixo fixos.',off:'Os aparelhos ficam só com IPv4.'};

  h+=mod('Verificação de segurança',`<form class="f" id="fscan"><label class="k">Aparelho</label><select name="alvo">${dsel}</select><span></span><span></span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" type="button" id="bPorts">Portas abertas</button><button class="btn sec" type="button" id="bWeak">Senhas fracas (FTP/SSH/Telnet)</button></div><span></span></form><p id="scanr" style="margin:10px 0 0"></p>`,{desc:'Como no app: o roteador procura portas abertas num aparelho da rede ou testa se ele aceita senhas fracas em FTP, SSH ou Telnet. Leva alguns segundos; não muda nada.'});

// SETTINGS: LAN
PAG.lan=async()=>{
  const [li,dh,mb]=await Promise.all([ler('api/xqnetwork/lan_info'),ler('api/xqnetwork/lan_dhcp'),ler('api/xqnetwork/macbind_info')]);
  const ip=((li.info||{}).ipv4||[])[0]?.ip||'', d=dh.info||{}, pre=ip.split('.').slice(0,3).join('.')+'.';
  const fim=(+d.start)+(+d.limit)-1;
  let h=mod('Servidor DHCP',`<form class="f" id="fdhcp">
    <label class="k">Faixa de IPs</label><div style="display:flex;gap:6px;align-items:center"><span class="mono">${pre}</span><input type="number" name="start" value="${esc(d.start)}" style="width:80px"> a <input type="number" name="end" value="${fim}" style="width:80px"></div><span></span>
    <label class="k">Tempo de concessão</label><input type="number" name="leasetime" value="${esc(d.leasetimeNum)}"><span class="t">minutos</span>
    <label class="k">DNS 1</label><input type="text" name="dns1" value="${esc(d.dns1)}"><span></span>
    <label class="k">DNS 2</label><input type="text" name="dns2" value="${esc(d.dns2)}"><span></span>
    <label class="k">Gateway anunciado</label><input type="text" name="router" value="${esc(d.router||ip)}"><span></span>
    <span></span><div><button class="btn">Salvar</button></div><span></span></form>`,{direita:sw(d.ignore!=='1','swDhcp'),desc:'Distribui IPs automaticamente na rede.'});
  h+=mod('Endereço IP do roteador',`<form class="f" id="flanip"><label class="k">IP</label><input type="text" name="ip" value="${esc(ip)}"><span class="t">mudar exige reiniciar e muda o endereço desta página</span><span></span><div><button class="btn perigo">Salvar</button></div><span></span></form>`);
  const res=(mb.list||[]);
  h+=mod('Reservas de IP (DHCP estático)',`<div class="tabw"><table><tr><th>Nome</th><th>MAC</th><th>IP</th><th></th></tr>${res.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono">${esc(r.mac)}</td><td class="mono">${esc(r.ip)}</td><td style="white-space:nowrap"><button class="btn peq sec" data-ed="${esc(r.mac)}" data-n="${esc(r.name)}" data-ip="${esc(r.ip)}">Editar</button> <button class="btn peq sec" data-unb="${esc(r.mac)}" data-n="${esc(r.name)}">Remover</button></td></tr>`).join('')}</table></div>
    <form class="f" id="fbind" style="margin-top:12px"><label class="k">Nome</label><input type="text" name="name"><span></span><label class="k">MAC</label><input type="text" name="mac" placeholder="AA:BB:CC:DD:EE:FF"><span></span><label class="k">IP</label><div style="display:flex;gap:6px;align-items:center"><span class="mono">${pre}</span><input type="number" name="ip" style="width:90px"></div><span></span><span></span><div style="display:flex;gap:8px"><button class="btn sec" id="bBind">Adicionar reserva</button><button type="button" class="btn sec" id="bBindCanc" style="display:none">Cancelar edição</button></div><span></span></form>`,{desc:`${res.length} reservas.`});
  $('#pagina').innerHTML=h;
  $('#fdhcp').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(await gravar('api/xqnetwork/set_lan_dhcp',{leasetime:f.leasetime+'m',start:f.start,end:f.end,ignore:0,dns1:f.dns1,dns2:f.dns2,router:f.router},{titulo:'Servidor DHCP',metodo:'GET'}))render();};
  $('#swDhcp').onclick=async()=>{const on=!$('#swDhcp').classList.contains('on');if(await gravar('api/xqnetwork/set_lan_dhcp',on?{ignore:0,start:d.start,end:fim,leasetime:d.leasetime,dns1:d.dns1,dns2:d.dns2,router:d.router||ip}:{ignore:1},{titulo:'DHCP: '+(on?'ligar':'desligar'),msg:on?'':'Sem DHCP, aparelhos novos não recebem IP.',metodo:'GET',perigo:!on}))render();};
  $('#flanip').onsubmit=async e=>{e.preventDefault();if(await gravar('api/xqnetwork/set_lan_ip',{ip:e.target.ip.value.trim()},{titulo:'Mudar IP do roteador',msg:'O roteador reinicia. Todas as reservas e integrações que usam 192.168.0.x podem quebrar.',metodo:'GET',perigo:true}))toast('Reiniciando…');};
  $$('#pagina [data-unb]').forEach(b=>b.onclick=async()=>{if(await gravar('api/xqnetwork/mac_unbind',{mac:b.dataset.unb},{titulo:'Remover reserva',msg:esc(b.dataset.n)+' · '+esc(b.dataset.unb)}))render();});
  const fb=$('#fbind'),modoEd=orig=>{fb.dataset.orig=orig||'';$('#bBind').textContent=tr(orig?'Salvar alteração':'Adicionar reserva');$('#bBindCanc').style.display=orig?'':'none';};
  $$('#pagina [data-ed]').forEach(b=>b.onclick=()=>{fb.name.value=b.dataset.n;fb.mac.value=b.dataset.ed;fb.ip.value=(b.dataset.ip||'').split('.').pop();modoEd(b.dataset.ed);fb.scrollIntoView({behavior:'smooth',block:'center'});fb.name.focus();});
  $('#bBindCanc').onclick=()=>{fb.reset();modoEd('');};
  fb.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(fb));const mac=f.mac.trim().toUpperCase(),orig=(fb.dataset.orig||'').toUpperCase(),ip=pre+f.ip;if(!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(mac)||!f.ip){toast(tr('MAC ou IP inválido'));return;}
    const outro=res.find(x=>x.ip===ip&&x.mac.toUpperCase()!==(orig||mac));if(outro){toast(tr('Este IP já está reservado para')+' '+outro.name,5000);return;}
    if(!orig){if(await gravar('api/xqnetwork/mac_bind',{data:JSON.stringify([{ip,mac,name:f.name}])},{titulo:'Adicionar reserva',msg:`${esc(f.name)} · ${mac} → ${esc(ip)}`}))render();return;}
    const antes=res.find(x=>x.mac.toUpperCase()===orig)||{};
    if(!await confirmar(tr('Editar reserva'),`${esc(antes.name||'')} · <span class="mono">${esc(orig)} → ${esc(antes.ip||'')}</span><br>${tr('passa a ser')}<br>${esc(f.name)} · <span class="mono">${mac} → ${esc(ip)}</span>`))return;
    // same MAC: mac_bind overwrites name/IP (tested 2026-11-09). New MAC: create the new one, then remove the old one.
    if(!await gravar('api/xqnetwork/mac_bind',{data:JSON.stringify([{ip,mac,name:f.name}])},{silencioso:true}))return;
    if(mac!==orig&&!await gravar('api/xqnetwork/mac_unbind',{mac:orig},{silencioso:true}))toast(tr('A reserva nova foi criada, mas a antiga não foi removida.'),6000);
    render();};
};

// SETTINGS: System
PAG.sistema=async()=>{
  const [tm,nm,cc,lg]=await Promise.all([ler('api/misystem/sys_time'),ler('api/misystem/router_name'),ler('api/xqsystem/country_code').catch(()=>({})),ler('api/xqsystem/get_languages').catch(()=>({}))]);
  const t=tm.time||{};
  const FUSOS=[['CST+3',3,'(UTC−3) Fortaleza / Caiena — sem horário de verão (recomendado)'],['CST+3',0,'(UTC−3) Brasília — ⚠ aplica horário de verão antigo (+1 h)'],['CST+3',1,'(UTC−3) Buenos Aires'],['CST+3',4,'(UTC−3) Montevidéu'],['CST+2',0,'(UTC−2) Fernando de Noronha'],['CST+4',0,'(UTC−4) Manaus / Cuiabá'],['CST+5',0,'(UTC−5) Rio Branco'],['CST-8',0,'(UTC+8) China']];
  let h=mod('Data, hora e fuso',`<p>Hora do roteador: <b>${String(t.hour).padStart(2,'0')}:${String(t.min).padStart(2,'0')}:${String(t.sec).padStart(2,'0')}</b> ${t.day}/${t.month}/${t.year} · fuso <span class="mono">${esc(t.timezone)}</span> (item ${t.index}) · PC: ${new Date().toTimeString().slice(0,8)}</p>
    ${eNo()?'<p class="muted">No repetidor, fuso e hora vêm do roteador principal pela Mesh — altere lá.</p>':''}<form class="f" id="ftz" ${eNo()?'hidden':''}><label class="k">Fuso horário</label><select name="tz">${FUSOS.map((f,i)=>`<option value="${i}" ${f[0]===t.timezone&&f[1]===t.index?'selected':''}>${f[2]}</option>`).join('')}</select><span class="t">na Mesh, defina no principal (é repassado ao repetidor)</span><span></span><div class="acoes" style="margin:0"><button class="btn sec">Salvar fuso</button><button class="btn sec" type="button" id="bHoraPc">Acertar hora pelo PC</button></div><span></span></form>`);
  h+=mod('Nome e local do roteador',`<form class="f" id="fnome"><label class="k">Nome</label><input type="text" name="name" value="${esc(nm.name)}"><span></span><label class="k">Local</label><input type="text" name="locale" value="${esc(nm.locale)}"><span></span><span></span><div><button class="btn sec">Salvar</button></div><span></span></form>`);
  if(!eNo()) h+=mod('Região do Wi-Fi',`<form class="f" id="fcc"><label class="k">Região</label><select name="code">${(cc.list||[]).map(c=>`<option value="${c.code}" ${c.code===cc.current?'selected':''}>${({CN:'China continental (recomendado no Brasil)',HK:'Hong Kong',TW:'Taiwan',KR:'Coreia',EU:'Europa'})[c.code]||esc(c.name)}</option>`).join('')}</select><span class="t">não existe Brasil</span><span></span><div><button class="btn sec">Salvar</button></div><span></span></form>`,{tag:'oculto',desc:'Define canais e potência permitidos. China é a mais próxima das regras brasileiras (inclui a faixa alta de 5 GHz, canais 149–165, e potência maior). Europa reduz a potência e troca a faixa alta pelos canais 100–140 com detecção de radar (DFS), que podem demorar minutos para subir. Mudar reinicia o Wi-Fi e vale para toda a Mesh.'});
  const LING={zh_cn:'Chinês simplificado',zh_hk:'Chinês tradicional (Hong Kong)',zh_tw:'Chinês tradicional (Taiwan)',en:'Inglês'};
  h+=mod('Idioma da interface original',`<form class="f" id="flang"><label class="k">Idioma</label><select name="language">${(lg.list||[]).map(l=>`<option value="${l.lang}" ${l.lang===lg.lang?'selected':''}>${LING[l.lang]||esc(l.name)} — ${esc(l.name)}</option>`).join('')}</select><span class="t">o firmware chinês não tem português nem inglês</span><span></span><div><button class="btn sec">Salvar</button></div><span></span></form>`);
  h+=mod('Registros (log)',`<div class="acoes"><button class="btn sec" id="bLog">Gerar e baixar log do sistema</button></div>`,{desc:'O roteador gera um arquivo com os registros do sistema — útil para investigar as travadas.'});
  h+=mod('Backup da configuração',`<div class="acoes"><button class="btn sec" id="bBkp">Gerar backup</button></div>
    <form class="f" id="frest" style="margin-top:12px"><label class="k">Restaurar de um arquivo</label><input type="file" name="arq"><span class="t">arquivo gerado por "Gerar backup"</span><span></span><div><button class="btn sec">Enviar e escolher o que restaurar</button></div><span></span></form>`,{desc:'Gera um arquivo com Wi-Fi, rede local e demais ajustes, ou restaura um backup. Depois de restaurar, o roteador reinicia.'});
  h+=mod('Firmware',`<div class="acoes"><button class="btn sec" id="bUpd">Procurar atualização</button></div><p class="muted" id="updr"></p>`);
  const ota=await ler('api/misystem/ota').catch(()=>({}));
  h+=mod('Atualização automática do firmware',`<form class="f" id="fota"><label class="k"></label><label class="chk"><input type="checkbox" name="auto" ${ota.auto==1?'checked':''}> ${tr('atualizar sozinho quando sair versão nova')}</label><span></span>
    <label class="k">Horário</label><select name="time">${Array.from({length:24},(_,i)=>`<option value="${i}" ${+ota.time===i?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('')}</select><span class="t">${tr('o roteador reinicia nesse horário ao atualizar')}</span>
    <label class="k"></label><label class="chk"><input type="checkbox" name="plugin" ${ota.plugin==1?'checked':''}> ${tr('atualizar também os plug-ins')}</label><span></span>
    <span></span><div><button class="btn sec">Salvar</button></div><span></span></form>`,{desc:'Opção do app oficial. A versão nova vem dos servidores da Xiaomi (versão chinesa).'});
  h+=mod('Restaurar padrão de fábrica',`<div class="acoes"><button class="btn perigo" id="bReset">Restaurar padrão de fábrica</button></div>`,{desc:'Apaga TODA a configuração (internet, Wi-Fi, reservas). Só como último recurso.'});
  $('#pagina').innerHTML=h;
  $('#fota').onsubmit=async e=>{e.preventDefault();const f=e.target;if(await gravar('api/misystem/set_ota',{auto:f.auto.checked?1:0,time:f.time.value,plugin:f.plugin.checked?1:0},{titulo:'Atualização automática',metodo:'GET'}))render();};
  $('#ftz').onsubmit=async e=>{e.preventDefault();const f=FUSOS[+e.target.tz.value];if(await gravar('api/misystem/set_sys_time',{timezone:f[0],index:f[1]},{titulo:'Fuso horário',msg:f[2]}))setTimeout(render,2000);};
  $('#bHoraPc').onclick=async()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');const s=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;if(await gravar('api/misystem/set_sys_time',{time:s},{titulo:'Acertar hora',msg:'Definir a hora do roteador para '+s}))setTimeout(render,1500);};
  $('#fnome').onsubmit=async e=>{e.preventDefault();if(await gravar('api/misystem/set_router_name',{name:e.target.name.value,locale:e.target.locale.value},{titulo:'Nome do roteador',metodo:'GET'}))render();};
  if($('#fcc')) $('#fcc').onsubmit=async e=>{e.preventDefault();if(await gravar('api/xqsystem/set_country_code',{country:e.target.code.value},{titulo:'Região do Wi-Fi',msg:'O Wi-Fi reinicia. Canais/potência mudam conforme a região.',perigo:true}))setTimeout(render,3000);};
  $('#flang').onsubmit=async e=>{e.preventDefault();if(await gravar('api/xqsystem/set_language',{language:e.target.language.value},{titulo:'Idioma'}))render();};
  $('#bLog').onclick=async()=>{toast('Gerando log…');try{const r=await ler('api/misystem/sys_log');if(r.path)window.open('http://'+r.path,'_blank');else toast('Sem caminho: '+JSON.stringify(r));}catch(e){toast(e.message);}};
  $('#frest').onsubmit=async e=>{e.preventDefault();const fl=e.target.arq.files[0];if(!fl){toast(tr('Escolha o arquivo de backup.'));return;}
    if(fl.size>4*1024*1024){toast(tr('Arquivo grande demais para um backup.'));return;}
    const b64=await new Promise((ok,er)=>{const rd=new FileReader();rd.onload=()=>ok(String(rd.result).split(',')[1]||'');rd.onerror=er;rd.readAsDataURL(fl);});
    const up=await gravar('api/misystem/c_upload',{},{titulo:'Enviar backup',msg:esc(fl.name)+' — '+tr('só envia o arquivo; nada muda até você escolher os itens.'),arquivo:{nome:fl.name,b64}});if(!up)return;
    const ks=((up.des||{}).keys)||{};const ch=Object.keys(ks);if(!ch.length){toast(tr('O arquivo não trouxe itens para restaurar.'),5000);return;}
    const ok=await dialogo(tr('Restaurar backup'),`<p class="muted">${tr('Escolha o que restaurar:')}</p>${ch.map(k=>`<label class="chk"><input type="checkbox" data-rk="${esc(k)}" checked> ${esc(tr(BKP[k]||ks[k]))}</label>`).join('')}`,[{t:'Cancelar',cls:'sec',v:false},{t:'Restaurar',cls:'perigo',v:true}]);
    if(!ok)return;const sel=$$('#dlg [data-rk]').filter(i=>i.checked).map(i=>i.dataset.rk);
    if(!sel.length){toast(tr('Escolha pelo menos um item.'));return;}
    if(!await gravar('api/misystem/c_restore',{keys:sel.join(',')},{titulo:'Restaurar backup',msg:sel.length+' '+tr('item(ns). Depois o roteador precisa reiniciar.'),metodo:'GET',perigo:true}))return;
    if(await gravar('api/xqsystem/reboot',{client:'web'},{titulo:'Reiniciar agora',msg:tr('A restauração só vale depois do reinício (cerca de 1 a 2 min sem internet).'),metodo:'GET',perigo:true}))toast(tr('Reiniciando…'),6000);};
  $('#bBkp').onclick=async()=>{const r=await gravar('api/misystem/c_backup',{keys:'mi_basic_info,mi_network_info,mi_wifi_info,mi_lan_info,mi_arn_info'},{titulo:'Gerar backup',msg:'Só gera um arquivo — não altera nada.',metodo:'GET'});if(r&&r.url)window.open('http://'+r.url,'_blank');};
  $('#bUpd').onclick=async()=>{$('#updr').textContent='Procurando…';try{const r=await ler('api/xqsystem/check_rom_update');$('#updr').textContent=r.needUpdate==1?`Nova versão ${r.version||''} disponível (${r.size||''}).`:'Firmware atualizado.';}catch(e){$('#updr').textContent=e.message;}};
  $('#bReset').onclick=async()=>{if(!await confirmar('Tem certeza?','Isto APAGA toda a configuração e a internet da casa para de funcionar até reconfigurar.',true))return;gravar('api/xqsystem/reset',{format:0},{titulo:'Restaurar padrão de fábrica',msg:'Última confirmação.',metodo:'GET',perigo:true});};
};

// ADVANCED: QoS
PAG.qos=async()=>{
  const q=await ler('api/misystem/qos_info');const on=q.status?.on==1,b=q.band||{};
  const MODOS={0:'Automático',1:'Prioridade para jogos',2:'Prioridade para navegação',3:'Prioridade para vídeo',4:'Manual por aparelho'};
  let h=mod('QoS inteligente (controle de banda)',`<p class="muted">Banda configurada: <b>↓ ${b.download} Mbps · ↑ ${b.upload} Mbps</b> · modo: <b>${MODOS[q.status?.mode]||q.status?.mode}</b></p>
    <form class="f" id="fband"><label class="k">Download</label><input type="number" name="download" value="${esc(b.download)}"><span class="t">Mbps</span><label class="k">Upload</label><input type="number" name="upload" value="${esc(b.upload)}"><span class="t">Mbps</span><span></span><div><button class="btn sec">Salvar banda</button></div><span></span></form>
    <form class="f" id="fmodo" style="margin-top:10px"><label class="k">Modo</label><select name="mode">${Object.entries(MODOS).map(([k,v])=>`<option value="${k}" ${String(q.status?.mode)===k?'selected':''}>${v}</option>`).join('')}</select><span></span><span></span><div><button class="btn sec">Salvar modo</button></div><span></span></form>`,
    {direita:sw(on,'swQos'),desc:'O QoS classifica e limita o tráfego de cada aparelho. Consome bastante processador neste roteador — se o roteador trava sob carga, desligar o QoS é um bom teste.'});
  h+=mod('Limite da rede de visitante',`<p class="muted">Hoje: até <b>${(q.guest?.percent*b.download).toFixed(1)} Mbps</b> de download e <b>${(q.guest?.percent_up*b.upload).toFixed(1)} Mbps</b> de upload.</p>
    <form class="f" id="fqg"><label class="k">Download máx.</label><input type="number" step="0.1" name="down" value="${(q.guest?.percent*b.download).toFixed(1)}"><span class="t">Mbps</span><label class="k">Upload máx.</label><input type="number" step="0.1" name="up" value="${(q.guest?.percent_up*b.upload).toFixed(1)}"><span class="t">Mbps</span><span></span><div><button class="btn sec">Salvar</button></div><span></span></form>`);
  const lst=q.list||[];
  h+=mod('Limites por aparelho',`<div class="tabw"><table><tr><th>Aparelho</th><th>IP</th><th>Agora</th><th>Limite ↓ / ↑</th><th></th></tr>${lst.map(d=>{const s=d.statistics||{},qq=d.qos||{};return `<tr><td>${esc(d.name)}</td><td class="mono">${esc(d.ip)}</td><td class="mono">↓${fmtV(s.downspeed)} ↑${fmtV(s.upspeed)}</td><td style="white-space:nowrap"><input type="number" min="0" step="1" data-lm="${esc(d.mac)}" data-k="down" value="${Math.round(+qq.downmax||0)}" style="width:86px"> / <input type="number" min="0" step="1" data-lm="${esc(d.mac)}" data-k="up" value="${Math.round(+qq.upmax||0)}" style="width:86px"> <span class="muted">KB/s</span></td><td>${+qq.downmax||+qq.upmax?`<button class="btn peq sec" data-off="${esc(d.mac)}">Remover limite</button>`:''}</td></tr>`;}).join('')}</table></div>
    ${lst.length?`<div class="acoes"><button class="btn sec" id="bLim">Salvar limites</button></div>`:`<p class="muted">${on?'Nenhum aparelho com dados de QoS ainda.':'Ligue o QoS para ver e limitar os aparelhos.'}</p>`}`,{desc:'Velocidade máxima de cada aparelho em KB/s (1 Mbps ≈ 125 KB/s); 0 = sem limite. Vale com o QoS ligado.'});
  const loc=q.local||{};
  h+=mod('Limite do próprio roteador',`<p class="muted">Hoje: até <b>${((+loc.percent||0)*b.download).toFixed(1)} Mbps</b> de download e <b>${((+loc.percent_up||0)*b.upload).toFixed(1)} Mbps</b> de upload.</p>
    <form class="f" id="fqx"><label class="k">Download máx.</label><input type="number" step="0.1" name="down" value="${((+loc.percent||0)*b.download).toFixed(1)}"><span class="t">Mbps</span><label class="k">Upload máx.</label><input type="number" step="0.1" name="up" value="${((+loc.percent_up||0)*b.upload).toFixed(1)}"><span class="t">Mbps</span><span></span><div><button class="btn sec">Salvar</button></div><span></span></form>`,{desc:'Limita o tráfego gerado pelo próprio roteador (atualizações, serviços Xiaomi), não o dos aparelhos.'});
  $('#pagina').innerHTML=h;
  $('#swQos').onclick=async()=>{const v=!$('#swQos').classList.contains('on');if(await gravar('api/misystem/qos_switch',{on:v?1:0},{titulo:'QoS: '+(v?'ligar':'desligar'),metodo:'GET'}))render();};
  $('#fband').onsubmit=async e=>{e.preventDefault();if(await gravar('api/misystem/set_band',{manual:1,upload:e.target.upload.value,download:e.target.download.value},{titulo:'Banda contratada'}))render();};
  $('#fmodo').onsubmit=async e=>{e.preventDefault();if(await gravar('api/misystem/qos_mode',{mode:e.target.mode.value},{titulo:'Modo do QoS',metodo:'GET'}))render();};
  $('#fqg').onsubmit=async e=>{e.preventDefault();const pd=e.target.down.value/b.download,pu=e.target.up.value/b.upload;if(await gravar('api/misystem/qos_guest',{percent:pd,percent_up:pu},{titulo:'Limite da rede de visitante',metodo:'GET'}))render();};
  $$('#pagina [data-off]').forEach(x=>x.onclick=async()=>{if(await gravar('api/misystem/qos_offlimit',{mac:x.dataset.off},{titulo:'Remover limite',metodo:'GET'}))render();});
  if($('#bLim'))$('#bLim').onclick=async()=>{const m={};$$('#pagina [data-lm]').forEach(i=>{(m[i.dataset.lm]=m[i.dataset.lm]||{mac:i.dataset.lm})[i.dataset.k==='down'?'maxdown':'maxup']=Math.max(0,+i.value||0);});
    const dados=Object.values(m);if(!await gravar('api/misystem/qos_limits',{data:JSON.stringify(dados)},{titulo:'Salvar limites por aparelho',msg:dados.filter(x=>x.maxdown||x.maxup).length+' '+tr('aparelho(s) com limite.')}))return;
    await gravar('api/misystem/qos_mode',{mode:q.status?.mode??0},{metodo:'GET',silencioso:true});render();};
  $('#fqx').onsubmit=async e=>{e.preventDefault();const pd=e.target.down.value/b.download,pu=e.target.up.value/b.upload;if(!(pd>0&&pd<=1&&pu>0&&pu<=1)){toast(tr('Use valores entre 0 e a banda contratada.'));return;}if(await gravar('api/misystem/qos_xq',{percent:pd,percent_up:pu},{titulo:'Limite do próprio roteador',metodo:'GET'}))render();};
};

// ADVANCED: parental control
PAG.pais=async()=>{
  const dl=await ler('api/misystem/devicelist');const L=(dl.list||[]).filter(d=>d.mac);
  let alvo=(()=>{try{return localStorage.getItem('pais_mac');}catch(_){return null;}})();if(!L.find(d=>d.mac===alvo))alvo=(L[0]||{}).mac;
  if(!alvo){$('#pagina').innerHTML=mod('Controle dos pais','<p class="muted">Nenhum aparelho.</p>');return;}
  const [inf,flt]=await Promise.all([ler('api/misystem/parctl_info',{mac:alvo}),ler('api/misystem/parctl_get_filter',{mac:alvo})]);
  const modo=(flt.urlfilter||{}).mode||'none',urls=modo==='none'?{list:[]}:await ler('api/misystem/parctl_get_url',{mac:alvo,mode:modo});
  const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],regras=inf.info||[];
  const dias=f=>(f||[]).map(n=>tr(DIAS[n-1]||n)).join(', ');
  let h=mod('Controle dos pais',`<form class="f" id="fpa"><label class="k">Aparelho</label><select name="mac">${L.map(d=>`<option value="${esc(d.mac)}" ${d.mac===alvo?'selected':''}>${esc(d.name||d.oname||d.mac)} · ${esc(d.mac)}</option>`).join('')}</select><span></span></form>`,{desc:'Horários sem internet e sites bloqueados (ou só permitidos) por aparelho, como no app oficial. ⚠ No app, o horário é o período SEM internet; confira no aparelho depois de criar.'});
  h+=mod('Horários sem internet',`<div class="tabw"><table><tr><th>Dias</th><th>Horário</th><th>Ativa</th><th></th></tr>${regras.length?regras.map((r,i)=>`<tr><td>${dias(r.frequency)}</td><td class="mono">${esc((r.timeseg||{}).from)}–${esc((r.timeseg||{}).to)}</td><td>${r.enable==1?'<span class="badge ok">sim</span>':'<span class="badge">não</span>'}</td><td style="white-space:nowrap"><button class="btn peq sec" data-ren="${i}">${r.enable==1?'Pausar':'Ativar'}</button> <button class="btn peq sec" data-rdel="${esc(r.id)}">Remover</button></td></tr>`).join(''):'<tr><td colspan="4" class="muted">Nenhum horário.</td></tr>'}</table></div>
    <form class="f" id="fre" style="margin-top:12px"><label class="k">Dias</label><div class="rad">${DIAS.map((d,i)=>`<label class="chk"><input type="checkbox" name="d" value="${i+1}" ${i<5?'checked':''}> ${d}</label>`).join('')}</div><span></span>
    <label class="k">De</label><input type="time" name="de" value="22:00"><span></span><label class="k">Até</label><input type="time" name="ate" value="07:00"><span></span>
    <span></span><div><button class="btn sec">Adicionar horário</button></div><span></span></form>`);
  h+=mod('Sites',`<form class="f" id="fmo"><label class="k">Filtro</label><select name="mode"><option value="none" ${modo==='none'?'selected':''}>Sem filtro</option><option value="black" ${modo==='black'?'selected':''}>Bloquear os sites da lista</option><option value="white" ${modo==='white'?'selected':''}>Permitir só os sites da lista</option></select><span></span></form>
    ${modo==='none'?'':`<div class="tabw" style="margin-top:10px"><table>${(urls.list||[]).length?(urls.list||[]).map(u=>`<tr><td class="mono">${esc(u)}</td><td><button class="btn peq sec" data-udel="${esc(u)}">Remover</button></td></tr>`).join(''):'<tr><td class="muted">Lista vazia.</td></tr>'}</table></div>
    <form class="f" id="fur" style="margin-top:10px"><label class="k">Site</label><input type="text" name="url" placeholder="example.com"><span></span><span></span><div><button class="btn sec">Adicionar site</button></div><span></span></form>`}`);
  $('#pagina').innerHTML=h;
  const nome=esc((L.find(d=>d.mac===alvo)||{}).name||alvo);
  $('#fpa').mac.onchange=e=>{try{localStorage.setItem('pais_mac',e.target.value);}catch(_){}render();};
  $('#fre').onsubmit=async e=>{e.preventDefault();const f=e.target,ds=[...f.querySelectorAll('[name=d]:checked')].map(x=>x.value);if(!ds.length||!f.de.value||!f.ate.value){toast(tr('Escolha os dias e o horário.'));return;}
    if(await gravar('api/misystem/parctl_add',{mac:alvo,enable:1,frequency:ds.join(','),timeseg:f.de.value+'-'+f.ate.value},{titulo:'Novo horário sem internet',msg:`${nome}: ${dias(ds.map(Number))} · ${esc(f.de.value)}–${esc(f.ate.value)}`}))render();};
  $$('#pagina [data-ren]').forEach(b=>b.onclick=async()=>{const r=regras[+b.dataset.ren];if(await gravar('api/misystem/parctl_update',{id:r.id,mac:alvo,enable:r.enable==1?0:1,frequency:(r.frequency||[]).join(','),timeseg:(r.timeseg||{}).from+'-'+(r.timeseg||{}).to},{titulo:r.enable==1?'Pausar horário':'Ativar horário',msg:nome}))render();});
  $$('#pagina [data-rdel]').forEach(b=>b.onclick=async()=>{if(await gravar('api/misystem/parctl_delete',{id:b.dataset.rdel},{titulo:'Remover horário',msg:nome}))render();});
  $('#fmo').mode.onchange=async e=>{if(await gravar('api/misystem/parctl_set_filter',{mac:alvo,mode:e.target.value},{titulo:'Filtro de sites',msg:nome}))render();else e.target.value=modo;};
  if($('#fur'))$('#fur').onsubmit=async e=>{e.preventDefault();const u=e.target.url.value.trim();if(!u)return;if(await gravar('api/misystem/parctl_set_url',{mac:alvo,opt:0,mode:modo,url:u},{titulo:'Adicionar site',msg:nome+' · '+esc(u)}))render();};
  $$('#pagina [data-udel]').forEach(b=>b.onclick=async()=>{if(await gravar('api/misystem/parctl_set_url',{mac:alvo,opt:1,mode:modo,url:b.dataset.udel},{titulo:'Remover site',msg:nome+' · '+esc(b.dataset.udel)}))render();});
};

// ADVANCED: DDNS
PAG.ddns=async()=>{

    <form class="f" id="fddns" style="margin-top:14px"><label class="k">Provedor</label><select name="id">${Object.entries(PROV).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span></span>
    <label class="k">Usuário</label><input type="text" name="username" autocomplete="off"><span></span>
    <label class="k">Senha</label><input type="password" name="password" autocomplete="new-password"><span></span>
    <label class="k">Domínio</label><input type="text" name="domain" placeholder="myhome.ddns.net"><span></span>
    <label class="k">Verificar o IP a cada</label><input type="number" name="checkinterval" min="1" value="10"><span class="t">minutos</span>
    <label class="k">Forçar atualização a cada</label><input type="number" name="forceinterval" min="1" value="24"><span class="t">horas</span>
    <span></span><div style="display:flex;gap:8px"><button class="btn sec" id="bDd">Adicionar serviço</button><button type="button" class="btn sec" id="bDdC" style="display:none">Cancelar edição</button></div><span></span></form>`);
  $('#pagina').innerHTML=h;
  $('#swDdns').onclick=async()=>{const on=d.on==1?0:1;if(await gravar('api/xqnetwork/ddns_switch',{on},{titulo:'DDNS: '+(on?'ligar':'desligar'),metodo:'GET'}))setTimeout(render,1500);};
  $$('#pagina [data-dsw]').forEach(b=>b.onclick=async()=>{if(await gravar('api/xqnetwork/server_switch',{id:b.dataset.dsw,on:b.dataset.on},{titulo:b.dataset.on==1?'Ativar serviço DDNS':'Desativar serviço DDNS',metodo:'GET'}))setTimeout(render,1500);});
  $$('#pagina [data-dup]').forEach(b=>b.onclick=async()=>{if(await gravar('api/xqnetwork/ddns_reload',{},{titulo:'Atualizar DDNS agora',metodo:'GET'}))setTimeout(render,1500);});
  $$('#pagina [data-ddel]').forEach(b=>b.onclick=async()=>{if(await gravar('api/xqnetwork/del_server',{id:b.dataset.ddel},{titulo:'Remover serviço DDNS',msg:esc(b.dataset.n),metodo:'GET',perigo:true}))render();});
  const f=$('#fddns'),modo=(id,en)=>{f.dataset.ed=id||'';f.dataset.en=en||'';f.id.disabled=!!id;$('#bDd').textContent=tr(id?'Salvar alteração':'Adicionar serviço');$('#bDdC').style.display=id?'':'none';};

  $$('#pagina [data-ded]').forEach(b=>b.onclick=async()=>{try{const g=await ler('api/xqnetwork/get_server',{id:b.dataset.ded},true);

  f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),ed=f.dataset.ed;

};

// ADVANCED: port forwarding and DMZ
PAG.portas=async()=>{
  const [p1,p2,dz]=await Promise.all([ler('api/xqnetwork/portforward',{ftype:1}),ler('api/xqnetwork/portforward',{ftype:2}),ler('api/xqnetwork/dmz')]);
  const pre=String(dz.lanip||'192.168.0.1').replace(/\d+$/,''),PR={1:'TCP',2:'UDP',3:'TCP e UDP'},L1=p1.list||[],L2=p2.list||[],dmzOn=dz.status==1;
  const prSel=`<select name="proto">${Object.entries(PR).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`;
  const ipIn=`<div style="display:flex;gap:6px;align-items:center"><span class="mono">${pre}</span><input type="number" name="ip" min="2" max="254" style="width:90px"></div>`;
  let h=mod('Encaminhamento de portas',`<div class="tabw"><table><tr><th>Nome</th><th>Protocolo</th><th>Porta externa</th><th>IP interno</th><th>Porta interna</th><th></th></tr>${L1.length?L1.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${PR[r.proto]||esc(r.proto)}</td><td class="mono">${esc(r.srcport)}</td><td class="mono">${esc(r.destip)}</td><td class="mono">${esc(r.destport)}</td><td style="white-space:nowrap"><button class="btn peq sec" data-ped="${i}">Editar</button> <button class="btn peq sec" data-pdel="${esc(r.srcport)}" data-pr="${esc(r.proto)}" data-n="${esc(r.name)}">Remover</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Nenhuma regra.</td></tr>'}</table></div>
    <form class="f" id="fpf" style="margin-top:14px"><label class="k">Nome</label><input type="text" name="name" maxlength="31"><span></span><label class="k">Protocolo</label>${prSel}<span></span>
    <label class="k">Porta externa</label><input type="number" name="sport" min="1" max="65535"><span class="t">a porta aberta na internet</span><label class="k">IP interno</label>${ipIn}<span></span>
    <label class="k">Porta interna</label><input type="number" name="dport" min="1" max="65535"><span class="t">a porta no aparelho</span>
    <span></span><div style="display:flex;gap:8px"><button class="btn sec" id="bPf">Adicionar regra</button><button type="button" class="btn sec" id="bPfC" style="display:none">Cancelar edição</button></div><span></span></form>`,{desc:'Libera uma porta da internet para um aparelho da casa. As regras novas, editadas ou removidas só passam a valer depois de "Aplicar regras".'});
  h+=mod('Encaminhamento de faixa de portas',`<div class="tabw"><table><tr><th>Nome</th><th>Protocolo</th><th>Portas</th><th>IP interno</th><th></th></tr>${L2.length?L2.map(r=>`<tr><td>${esc(r.name)}</td><td>${PR[r.proto]||esc(r.proto)}</td><td class="mono">${esc((r.srcport||{}).f)}–${esc((r.srcport||{}).t)}</td><td class="mono">${esc(r.destip)}</td><td><button class="btn peq sec" data-rdel="${esc((r.srcport||{}).f)}" data-pr="${esc(r.proto)}" data-n="${esc(r.name)}">Remover</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Nenhuma regra.</td></tr>'}</table></div>
    <form class="f" id="frg" style="margin-top:14px"><label class="k">Nome</label><input type="text" name="name" maxlength="31"><span></span><label class="k">Protocolo</label>${prSel}<span></span>
    <label class="k">Porta inicial</label><input type="number" name="fport" min="1" max="65535"><span></span><label class="k">Porta final</label><input type="number" name="tport" min="1" max="65535"><span></span>
    <label class="k">IP interno</label>${ipIn}<span class="t">as mesmas portas no aparelho</span><span></span><div><button class="btn sec">Adicionar faixa</button></div><span></span></form>`);
  h+=mod('Aplicar regras',`<div class="acoes"><button class="btn" id="bPfAp">Aplicar regras</button></div>`,{desc:'Faz as regras de encaminhamento (portas e faixas) passarem a valer. Leva alguns segundos.'});
  h+=mod('DMZ',`<p class="muted">${dmzOn?`Ligada para <b class="mono">${esc(dz.ip)}</b>.`:'Desligada.'}</p><form class="f" id="fdmz"><label class="k">Aparelho (IP)</label>${ipIn}<span class="t">recebe todas as conexões vindas da internet que não tenham regra</span><span></span><div><button class="btn sec">${dmzOn?'Alterar':'Ligar DMZ'}</button></div><span></span></form>`,{direita:dmzOn?sw(true,'swDmz'):'',desc:'Expõe um aparelho inteiro à internet. Use só se souber o que está fazendo. O roteador não deixa ligar a DMZ enquanto houver regra de encaminhamento de portas (testado).'});
  $('#pagina').innerHTML=h;
  const f=$('#fpf');let orig=null;const modo=r=>{orig=r;$('#bPf').textContent=tr(r?'Salvar alteração':'Adicionar regra');$('#bPfC').style.display=r?'':'none';};
  $('#bPfC').onclick=()=>{f.reset();modo(null);};
  $$('#pagina [data-ped]').forEach(b=>b.onclick=()=>{const r=L1[+b.dataset.ped];f.name.value=r.name;f.proto.value=r.proto;f.sport.value=r.srcport;f.ip.value=String(r.destip).split('.').pop();f.dport.value=r.destport;modo(r);f.scrollIntoView({behavior:'smooth',block:'center'});});
  f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.name.trim()||!v.sport||!v.ip||!v.dport){toast(tr('Preencha todos os campos.'));return;}
    const p={name:v.name.trim(),proto:v.proto,sport:v.sport,ip:pre+v.ip,dport:v.dport};
    if(!orig){if(!await gravar('api/xqnetwork/add_redirect',p,{titulo:'Adicionar regra',msg:`${esc(p.name)} · ${PR[p.proto]} ${esc(p.sport)} → ${esc(p.ip)}:${esc(p.dport)}`}))return;}
    else{// this firmware ignores force=1: remove the old rule, then add the new one (put the old one back if that fails)
      if(!await confirmar(tr('Editar regra'),`${esc(orig.name)} · ${PR[orig.proto]} ${esc(orig.srcport)} → ${esc(orig.destip)}:${esc(orig.destport)}<br>${tr('passa a ser')}<br>${esc(p.name)} · ${PR[p.proto]} ${esc(p.sport)} → ${esc(p.ip)}:${esc(p.dport)}`))return;
      if(!await gravar('api/xqnetwork/delete_redirect',{port:orig.srcport,proto:orig.proto},{silencioso:true}))return;
      if(!await gravar('api/xqnetwork/add_redirect',p,{silencioso:true})){await gravar('api/xqnetwork/add_redirect',{name:orig.name,proto:orig.proto,sport:orig.srcport,ip:orig.destip,dport:orig.destport},{silencioso:true});toast(tr('Não deu certo; a regra antiga foi mantida.'),6000);render();return;}}
    toast(tr('Salvo. Clique em "Aplicar regras" para valer.'),5000);render();};
  $$('#pagina [data-pdel],#pagina [data-rdel]').forEach(b=>b.onclick=async()=>{if(await gravar('api/xqnetwork/delete_redirect',{port:b.dataset.pdel||b.dataset.rdel,proto:b.dataset.pr},{titulo:'Remover regra',msg:esc(b.dataset.n)+' — '+tr('depois clique em "Aplicar regras".'),perigo:true}))render();});
  $('#frg').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.name.trim()||!v.fport||!v.tport||!v.ip||+v.tport<+v.fport){toast(tr('Preencha todos os campos (porta final ≥ inicial).'));return;}
    if(await gravar('api/xqnetwork/add_range_redirect',{name:v.name.trim(),proto:v.proto,fport:v.fport,tport:v.tport,ip:pre+v.ip},{titulo:'Adicionar faixa',msg:`${esc(v.name)} · ${esc(v.fport)}–${esc(v.tport)} → ${esc(pre+v.ip)}`})){toast(tr('Salvo. Clique em "Aplicar regras" para valer.'),5000);render();}};
  $('#bPfAp').onclick=async()=>{if(await gravar('api/xqnetwork/redirect_apply',{},{titulo:'Aplicar regras de encaminhamento',metodo:'GET'}))setTimeout(render,3000);};
  const fd=$('#fdmz');if(dmzOn&&dz.ip)fd.ip.value=String(dz.ip).split('.').pop();
  fd.onsubmit=async e=>{e.preventDefault();if(!fd.ip.value){toast(tr('Informe o IP.'));return;}if(await gravar('api/xqnetwork/set_dmz',{ip:pre+fd.ip.value},{titulo:'DMZ',msg:tr('Todas as portas sem regra vão para')+' '+esc(pre+fd.ip.value)+'.',perigo:true}))setTimeout(render,3000);};
  if($('#swDmz'))$('#swDmz').onclick=async()=>{if(await gravar('api/xqnetwork/dmz_off',{},{titulo:'Desligar DMZ',metodo:'GET'})){await gravar('api/xqnetwork/dmz_reload',{},{metodo:'GET',silencioso:true});setTimeout(render,2000);}};
};

// ADVANCED: VPN (PPTP/L2TP client)
PAG.vpn=async()=>{
  const [v,st,sv,mv,dl]=await Promise.all([ler('api/xqsystem/vpn',null,true),ler('api/xqsystem/vpn_status').catch(()=>({})),ler('api/misystem/smartvpn_info').catch(()=>({})),ler('api/misystem/mi_vpn_info').catch(()=>({})),ler('api/misystem/devicelist').catch(()=>({}))]);
  const L=v.list||[],cur=v.current||{},STV={0:'conectado',1:'conectando…',2:'falhou',3:'desconectado',4:'não ativado'},si=sv.info||{},con=st.status===0||st.status===1;
  let h=mod('VPN',`<p class="muted">Estado: <b>${STV[st.status]??esc(st.status)}</b>${st.status===0&&st.uptime?' · '+fmtT(st.uptime):''}${st.errmsg?` · <span class="err">${esc(st.errmsg)}</span>`:''}${cur.id?` · ${tr('servidor atual')}: <b>${esc((L.find(x=>x.id==cur.id)||{}).oname||cur.server)}</b>`:''}</p>

    <label class="k">Protocolo</label><select name="proto"><option value="pptp">PPTP</option><option value="l2tp">L2TP</option></select><span></span>
    <label class="k">Servidor</label><input type="text" name="server" placeholder="vpn.example.com"><span></span>
    <label class="k">Usuário</label><input type="text" name="username" autocomplete="off"><span></span>
    <label class="k">Senha</label><input type="password" name="password" autocomplete="new-password"><span></span>

    {direita:cur.id?`<span class="muted" style="font-size:12px">${tr('Conectar ao ligar')}</span> ${sw(cur.auto=='1','swVauto')}`:'',desc:'O roteador se conecta a um servidor VPN (PPTP ou L2TP) e manda o tráfego da casa por ele.'});

  const um=si.mode==2?2:1,ul=si.ulist||[],ml=si.mlist||[];

    ${si.switch==1?`<form class="f" id="fsm"><label class="k">Dividir por</label><select name="mode"><option value="1" ${um==1?'selected':''}>endereço de serviço</option><option value="2" ${um==2?'selected':''}>aparelho</option></select><span></span></form>
    <div class="tabw" style="margin-top:10px"><table>${um==1?(ul.length?ul.map(u=>`<tr><td class="mono">${esc(u)}</td><td><button class="btn peq sec" data-surl="${esc(u)}">Remover</button></td></tr>`).join(''):'<tr><td class="muted">Nenhum endereço.</td></tr>'):(ml.length?ml.map(m=>`<tr><td>${esc((si.name||{})[m]||nomes[String(m).toUpperCase()]||'')}</td><td class="mono">${esc(m)}</td><td><button class="btn peq sec" data-smac="${esc(m)}">Remover</button></td></tr>`).join(''):'<tr><td class="muted">Nenhum aparelho.</td></tr>')}</table></div>

  $('#pagina').innerHTML=h;
  $$('#pagina [data-vcon]').forEach(b=>b.onclick=async()=>{if(await gravar('api/xqsystem/vpn_switch',{conn:b.dataset.c,id:b.dataset.vcon},{titulo:b.dataset.c==1?'Conectar VPN':'Desconectar VPN',msg:b.dataset.c==1?tr('Todo o tráfego da casa passa a sair pela VPN.'):'',metodo:'GET'}))setTimeout(render,4000);});

  $$('#pagina [data-ved]').forEach(b=>b.onclick=()=>{const x=L[+b.dataset.ved];f.oname.value=x.oname||'';f.proto.value=String(x.proto||'pptp').toLowerCase();f.server.value=x.server||'';f.username.value=x.username||'';f.password.value=x.password||'';modo(x.id);f.scrollIntoView({behavior:'smooth',block:'center'});});

  $('#swSmart').onclick=async()=>{const on=si.switch==1?0:1;if(on&&st.status!==0){toast(tr('Conecte a VPN antes.'),5000);return;}if(await gravar('api/misystem/smartvpn_switch',{enable:on,mode:um},{titulo:'Divisão inteligente: '+(on?'ligar':'desligar'),msg:on?tr('Vale a partir da próxima conexão da VPN; "Serviços Xiaomi pela VPN" é desligado.'):'',metodo:'GET'}))render();};

  if($('#fsa'))$('#fsa').onsubmit=async e=>{e.preventDefault();const val=e.target.v.value.trim();if(!val)return;
    if(um==1?await gravar('api/misystem/smartvpn_url',{url:val,opt:0},{titulo:'Adicionar endereço à VPN',msg:esc(val)}):await gravar('api/misystem/smartvpn_mac',{macs:val,opt:0},{titulo:'Adicionar aparelho à VPN',msg:esc(val)}))render();};
  $$('#pagina [data-surl]').forEach(b=>b.onclick=async()=>{if(await gravar('api/misystem/smartvpn_url',{url:b.dataset.surl,opt:1},{titulo:'Remover endereço',msg:esc(b.dataset.surl)}))render();});
  $$('#pagina [data-smac]').forEach(b=>b.onclick=async()=>{if(await gravar('api/misystem/smartvpn_mac',{macs:b.dataset.smac,opt:1},{titulo:'Remover aparelho',msg:esc(b.dataset.smac)}))render();});
  $('#swMiv').onclick=async()=>{const on=mv.status==1?0:1;
    if(on&&con){if(!await gravar('api/xqsystem/vpn_switch',{conn:0,id:cur.id},{titulo:'Serviços Xiaomi pela VPN: ligar',msg:tr('A VPN será desconectada; reconecte depois para valer.'),metodo:'GET'}))return;if(await gravar('api/misystem/mi_vpn',{open:on},{metodo:'GET',silencioso:true}))render();return;}
    if(await gravar('api/misystem/mi_vpn',{open:on},{titulo:'Serviços Xiaomi pela VPN: '+(on?'ligar':'desligar'),metodo:'GET'}))render();};
};

// ADVANCED: other (UPnP)
PAG.outros=async()=>{
  const u=await ler('api/xqsystem/upnp');const L=u.list||[];
  const h=mod('UPnP',`<p class="muted">${u.status==1?'Ligado':'Desligado'} · ${L.length} ${tr('portas abertas automaticamente')}</p><div class="tabw"><table><tr><th>Protocolo</th><th>Aplicativo</th><th>IP do aparelho</th><th>Porta do aparelho</th><th>Porta externa</th></tr>${L.length?L.map(x=>`<tr><td>${esc(x.protocol)}</td><td>${esc(x.name)}</td><td class="mono">${esc(x.ip)}</td><td class="mono">${esc(x.cport)}</td><td class="mono">${esc(x.rport)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Nenhuma porta aberta por UPnP no momento.</td></tr>'}</table></div>`,{direita:sw(u.status==1,'swUpnp'),desc:'Deixa aparelhos e programas (consoles, chamadas de vídeo, Chromecast) abrirem portas sozinhos. Desligar aumenta a segurança, mas alguns aplicativos podem parar de funcionar direito.'});
  $('#pagina').innerHTML=h;
  $('#swUpnp').onclick=async()=>{const on=u.status==1?0:1;if(await gravar('api/xqsystem/upnp_switch',{switch:on},{titulo:'UPnP: '+(on?'ligar':'desligar'),metodo:'GET',perigo:!on}))setTimeout(render,1500);};
};

   <tr><td>As 440+ funções internas do firmware, com descrição, exemplo e chamada livre</td><td>${tr('acima')}</td></tr>
  </table>`,{desc:'Itens que a interface web original não mostra (vêm do app oficial ou de funções escondidas do firmware).'});
const ligarGo=()=>$$('#pagina [data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();sub=a.dataset.go.split(':').pop();try{localStorage.setItem('sub',sub);}catch(_){}render();});

// ADVANCED: API explorer
let EPS={};
PAG.api=async()=>{
  if(!EPS[rot]){const d=await srv('/api/endpoints?roteador='+rot),vistos=new Set((d||[]).map(e=>e.endpoint));
    const LEITURA=/(^get_|_info$|_status$|status$|_list$|list$|_result$|^info|_detail|detail_all$|^mode$|_mode$|_records$|^ota$|^vpn$|^upnp$|^dmz$|^ddns$|portforward|^wifi_log$|statistics$)/;
    EPS[rot]=(d||[]).concat(Object.keys(FUNCOES).map(k=>'api/'+k).filter(e=>!vistos.has(e)).map(e=>({endpoint:e,escrita:!LEITURA.test(e.split('/').pop())}))).sort((a,b)=>(a.escrita-b.escrita)||a.endpoint.localeCompare(b.endpoint));}
  $('#pagina').innerHTML=mod('Todas as funções internas',`<div style="display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:14px">
   <div><input type="text" id="flt" placeholder="filtrar (wifi, qos, time…)"><div id="eps" style="max-height:60vh;overflow:auto;margin-top:8px"></div></div>
   <div><div style="display:flex;gap:6px"><select id="met" style="width:90px"><option>GET</option><option>POST</option></select><input type="text" id="ep" class="mono" placeholder="api/xqnetwork/wifi_detail_all"></div>
   <p id="desc" style="margin:8px 0 0;font-size:13px" class="muted">Escolha uma função à esquerda para ver o que ela faz.</p>
   <input type="text" id="par" class="mono" placeholder='parâmetros JSON, ex.: {"mac":"AA:BB:…"}' style="margin-top:6px">
   <div class="acoes"><button class="btn" id="exe">Executar</button><label class="chk"><input type="checkbox" id="mos"> mostrar senhas</label></div><pre id="out" class="muted">O resultado aparece aqui.</pre></div></div>`,{desc:'Chamada direta à API interna. Funções que alteram algo pedem confirmação.'})+ocultasMod();
  ligarGo();
  const lst=()=>{const f=$('#flt').value.toLowerCase();$('#eps').innerHTML=EPS[rot].filter(e=>e.endpoint.includes(f)||((FUNCOES[e.endpoint.replace('api/','')]||[])[1]||'').toLowerCase().includes(f)).map(e=>{const d=FUNCOES[e.endpoint.replace('api/','')];return `<div style="padding:6px 4px;border-bottom:1px solid var(--sep);cursor:pointer" data-ep="${e.endpoint}" data-w="${e.escrita?1:0}"><div class="mono" style="display:flex;justify-content:space-between;gap:6px"><span>${e.endpoint.replace('api/','')}</span><span class="badge ${e.escrita?'no':''}">${e.escrita?'altera':'leitura'}</span></div><div style="font-size:11px;margin-top:2px" class="muted">${d?(d[0]==='i'?'<b class="inf">⚠ INFERÊNCIA</b> — ':'')+esc(d[1]):''}</div></div>`;}).join('');
    $$('#eps [data-ep]').forEach(x=>x.onclick=()=>{const k=x.dataset.ep.replace('api/',''),ex=(FUNCOES[k]||[])[2];$('#ep').value=x.dataset.ep;$('#desc').innerHTML=descFn(x.dataset.ep)+(ex?`<br><b>Exemplo:</b> <span class="mono">${ex.m} ${esc(JSON.stringify(ex.p))}</span> <span class="muted">(já preenchido abaixo; valores fictícios, troque antes de executar)</span>`:'');$('#par').value=ex&&Object.keys(ex.p).length?JSON.stringify(ex.p):'';$('#met').value=ex?ex.m:(x.dataset.w==='1'?'POST':'GET');if(x.dataset.w!=='1'&&!ex)$('#exe').click();});};
  $('#flt').oninput=lst;lst();
  $('#exe').onclick=async()=>{let p={};try{if($('#par').value.trim())p=JSON.parse($('#par').value);}catch{toast('JSON inválido');return;}
    const ep=$('#ep').value.trim(),w=$('#met').value==='POST'||(EPS[rot].find(e=>e.endpoint===ep)||{}).escrita;
    if(w&&!await confirmar('Executar função que altera o roteador',`<span class="mono">${esc(ep)}</span><br>${esc(JSON.stringify(p))}`,true))return;
    $('#out').textContent='…';const r=await srv('/api/chamar',{roteador:rot,endpoint:ep,metodo:$('#met').value,params:p,confirmado:!!w,mostrar:$('#mos').checked});$('#out').textContent=JSON.stringify(r.json??r.texto??r,null,2);};
};

// ---------- router addresses ----------
function preencherSel(){$('#rotsel').innerHTML=Object.entries(estado.roteadores).map(([n,ip])=>`<option value="${esc(n)}" ${n===rot?'selected':''}>${esc(n[0].toUpperCase()+n.slice(1))} · ${esc(ip)}</option>`).join('');}
$('#bcfg').onclick=()=>{
  const linha=(n,ip)=>`<div class="lcfg" style="display:flex;gap:6px;margin-bottom:6px"><input type="text" class="cn" value="${esc(n)}" placeholder="nome (ex.: principal)" style="flex:1"><input type="text" class="ci mono" value="${esc(ip)}" placeholder="192.168.0.1" style="flex:1"><button class="btn peq sec crm" type="button" title="remover">✕</button></div>`;
  $('#dlg').innerHTML=`<h4>Endereços dos roteadores</h4><p class="muted" style="margin-top:0">Se um roteador mudar de IP, corrija aqui. Fica salvo em %APPDATA%\\MiWiFiPainel.</p><div id="lcfgs">${Object.entries(estado.roteadores).map(([n,ip])=>linha(n,ip)).join('')}</div>
   <button class="btn peq sec" type="button" id="cadd">+ adicionar roteador</button><p class="err" id="cerr"></p>
   <div class="acoes" style="justify-content:flex-end"><button class="btn sec" id="ccan">Cancelar</button><button class="btn" id="csal">Salvar</button></div>`;
  $('#veu').style.display='flex';
  const liga=()=>$$('.crm').forEach(b=>b.onclick=()=>b.closest('.lcfg').remove());liga();
  $('#cadd').onclick=()=>{$('#lcfgs').insertAdjacentHTML('beforeend',linha('',''));liga();};
  $('#ccan').onclick=()=>$('#veu').style.display='none';
  $('#csal').onclick=async()=>{const lst=$$('.lcfg').map(l=>({nome:l.querySelector('.cn').value,ip:l.querySelector('.ci').value}));
    const r=await srv('/api/config',{roteadores:lst});if(!r.ok){$('#cerr').textContent=r.erro;return;}
    $('#veu').style.display='none';estado=await srv('/api/estado');if(!estado.roteadores[rot])rot=Object.keys(estado.roteadores)[0];preencherSel();EPS={};render();toast('Endereços salvos.');};
};

// ---------- startup ----------
$('#bsair').onclick=async()=>{if(!confirm(tr('Encerrar o painel?')))return;try{await srv('/api/sair',{});}catch(e){}document.body.innerHTML='<p style="font:16px sans-serif;padding:40px">Painel encerrado. Pode fechar esta aba.</p>';};
if(window.__MIWIFI_RODAPE__)$('#rodape').innerHTML=window.__MIWIFI_RODAPE__;
const GITHUB='https://github.com/wmariz/Xiaomi-Router-AX1800-CN-HA-Integration';
if(EMBUTIDO){$('#bcfg').style.display='none';$('#bsair').style.display='none';$('#rodape').innerHTML='Painel do Home Assistant · usa o login da integração · alterações sempre pedem confirmação · <span class="oculto">oculto</span> = função que não aparece na interface original';}
$('#rodape').insertAdjacentHTML('beforeend',` · <a class="notr" href="${GITHUB}" target="_blank" rel="noopener">GitHub</a>`);
(async()=>{estado=await srv('/api/estado');
  // ?rot= accepts the key ('principal', 'repetidor (Sala)'…) or the router IP
  if(!estado.roteadores[rot]){const k=Object.keys(estado.roteadores).find(k=>estado.roteadores[k]===rot);rot=k||Object.keys(estado.roteadores)[0];}
  preencherSel();
  $('#rotsel').onchange=()=>{rot=$('#rotsel').value;localStorage.setItem('rot',rot);render();};render();})();

// language: links (outside HA only), marking and continuous translation of whatever is drawn
$$('#lang a').forEach(a=>{a.classList.toggle('act',a.dataset.l===LANG);a.onclick=e=>{e.preventDefault();try{localStorage.setItem('lang',a.dataset.l);}catch(_){}location.reload();};});
if(EMBUTIDO&&$('#lang'))$('#lang').style.display='none';
try{document.documentElement.lang=LANG==='en'?'en':'pt-BR';}catch(_){}
if(LANG==='en'){const raiz=ROOT===document?document.body:ROOT;traduzir(raiz);
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){const pe=m.target.parentElement;if(pe)traduzir(pe);}else m.addedNodes.forEach(x=>traduzir(x.nodeType===3?(x.parentElement||x):x));}}).observe(raiz,{childList:true,subtree:true,characterData:true});}
</script>
